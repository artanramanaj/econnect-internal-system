<div class="min-h-screen bg-gray text-light-black flex flex-col">
  <header
    class="flex flex-wrap items-center gap-3 px-8 py-3 bg-white border-b border-card-border min-h-17.25"
  >
    <nav [attr.aria-label]="'common.breadcrumb' | translate" class="flex gap-2 text-muted">
      <span>{{ 'quotes.breadcrumbRoot' | translate }}</span>
      <span aria-hidden="true">/</span>
      <span class="text-light-black font-semibold">{{ 'quotes.list.breadcrumb' | translate }}</span>
    </nav>
    <div class="flex-1"></div>
    @if (canManage()) {
      <a
        routerLink="/quotes/new"
        class="h-11 px-4.5 inline-flex items-center gap-2 rounded-[10px] bg-primary text-dark-blue font-bold no-underline hover:brightness-95"
      >
        + {{ 'quotes.new' | translate }}
      </a>
    }
  </header>

  <main class="px-8 pt-7 pb-12 flex flex-col gap-5">
    <h1 class="m-0">{{ 'quotes.title' | translate }}</h1>

    @if (error(); as message) {
      <app-error-message variant="banner" [message]="message" />
    }

    <!-- The status views keep ~200px; the table takes the spare width and the
         views wrap above it on narrow screens. -->
    <div class="flex flex-wrap gap-6 items-start">
      <app-quote-table
        [quotes]="quotes()"
        [meta]="meta()"
        [statusCounts]="statusCounts()"
        [partners]="partners()"
        [authors]="options().authors"
        [filters]="filters()"
        [sort]="sort()"
        [canViewCost]="canViewCost()"
        [minMarkupPct]="options().minMarkupPct"
        [loading]="loading()"
        (search)="onSearch($event)"
        (filterChange)="onFilter($event)"
        (sortChange)="onSort($event)"
        (pageChange)="onPage($event)"
      />
    </div>
  </main>
</div>
