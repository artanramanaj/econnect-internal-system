<div class="min-h-screen bg-gray text-light-black flex flex-col">
  <header
    class="flex flex-wrap items-center gap-3 px-8 py-3 bg-white border-b border-card-border min-h-17.25"
  >
    <nav aria-label="Breadcrumb" class="flex gap-2 text-muted">
      <span>{{ 'users.breadcrumbRoot' | translate }}</span>
      <span aria-hidden="true">/</span>
      <span class="text-light-black font-semibold">{{ 'users.breadcrumb' | translate }}</span>
    </nav>
  </header>

  <main class="px-8 pt-7 pb-12 flex flex-col gap-5">
    <div>
      <h1 class="m-0">{{ 'users.title' | translate }}</h1>
      <p class="mt-1 mb-0 text-muted">{{ 'users.subtitle' | translate }}</p>
    </div>

    @if (error(); as message) {
      <app-error-message variant="banner" [message]="message" [details]="issueMessages()" />
    }

    <div class="flex flex-wrap gap-5 items-start">
      <app-user-table
        [people]="people()"
        [meta]="peopleMeta()"
        [roles]="roles()"
        [canViewCost]="canViewCost()"
        [loading]="loading()"
        [manageableIds]="manageableIds()"
        (search)="onSearch($event)"
        (groupFilterChange)="onGroupFilter($event)"
        (edit)="openEdit($event)"
        (pageChange)="onPeoplePage($event)"
      />

      <app-add-employee
        [grantableRoles]="grantableRoles()"
        [positions]="selectablePositions()"
        [saving]="saving()"
        (submitted)="submitAdd($event)"
      />
    </div>

    <app-access-request
      [requests]="pending()"
      [grantableRoles]="grantableRoles()"
      [roles]="roles()"
      [selectedRoles]="requestRole()"
      [saving]="saving()"
      (roleChange)="onRequestRole($event)"
      (approve)="approve($event)"
      (reject)="reject($event)"
    />

    <app-positions
      [positions]="positions()"
      [meta]="positionsMeta()"
      [activeCount]="positionsActiveCount()"
      [saving]="saving()"
      (add)="addPosition($event)"
      (edit)="editPosition($event)"
      (remove)="removePosition($event)"
      (pageChange)="onPositionsPage($event)"
    />

    <app-groups-permissions [matrix]="matrix()" />
  </main>
</div>

@if (editing(); as person) {
  <app-user-edit-drawer
    [person]="person"
    [canViewCost]="canViewCost()"
    [saving]="saving()"
    [isSelf]="editIsSelf()"
    [roleOptions]="editRoleOptions()"
    [positions]="selectablePositions()"
    (close)="closeEdit()"
    (save)="submitEdit($event)"
    (roleChange)="changeRole($event)"
    (statusChange)="changeStatus($event)"
    (deactivate)="deactivate()"
  />
}

@if (positionToDelete(); as position) {
  <app-delete-modal
    [heading]="'users.positions.deleteHeading' | translate"
    [message]="'users.positions.confirmDelete' | translate: { name: position.name }"
    (cancel)="cancelRemovePosition()"
    (confirm)="confirmRemovePosition()"
  />
}
