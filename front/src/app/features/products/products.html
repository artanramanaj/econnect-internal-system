<div class="min-h-screen bg-gray text-light-black flex flex-col">
  <header
    class="flex flex-wrap items-center gap-3 px-8 py-3 bg-white border-b border-card-border min-h-17.25"
  >
    <nav [attr.aria-label]="'common.breadcrumb' | translate" class="flex gap-2 text-muted">
      <span>{{ 'items.breadcrumbRoot' | translate }}</span>
      <span aria-hidden="true">/</span>
      <span class="text-light-black font-semibold">{{ 'items.breadcrumb' | translate }}</span>
    </nav>
  </header>

  <main class="px-8 pt-7 pb-12 flex flex-col gap-5">
    <h1 class="m-0">{{ 'items.title' | translate }}</h1>

    @if (error(); as message) {
      <app-error-message variant="banner" [message]="message" [details]="issueMessages()" />
    }

    <!-- The table takes the spare width; the add card keeps ~340px and wraps
         below on narrow screens (the employees screen's layout). -->
    <div class="flex flex-wrap gap-5 items-start">
      <app-item-table
        [items]="items()"
        [meta]="meta()"
        [options]="options()"
        [canViewCost]="canViewCost()"
        [canManage]="canManage()"
        [loading]="loading()"
        (search)="onSearch($event)"
        (filterChange)="onFilter($event)"
        (open)="openItem($event)"
        (openPdf)="openPdf($event)"
        (pageChange)="onPage($event)"
      />

      @if (canManage()) {
        <app-add-item
          [options]="options()"
          [canViewCost]="canViewCost()"
          [saving]="saving()"
          (submitted)="submitAdd($event)"
        />
      }
    </div>

    <div class="flex flex-wrap gap-5 items-start">
      <app-ref-table
        #categoriesTable
        kind="categories"
        [refs]="categories()"
        [meta]="categoriesMeta()"
        [saving]="saving()"
        [canManage]="canManage()"
        (add)="addRef('categories', $event)"
        (rename)="renameRef('categories', $event)"
        (remove)="removeRef('categories', $event)"
        (pageChange)="onRefPage('categories', $event)"
      />

      <app-ref-table
        #brandsTable
        kind="brands"
        [refs]="brands()"
        [meta]="brandsMeta()"
        [saving]="saving()"
        [canManage]="canManage()"
        (add)="addRef('brands', $event)"
        (rename)="renameRef('brands', $event)"
        (remove)="removeRef('brands', $event)"
        (pageChange)="onRefPage('brands', $event)"
      />
    </div>
  </main>
</div>

@if (editing(); as item) {
  <app-item-drawer
    [item]="item"
    [options]="options()"
    [canViewCost]="canViewCost()"
    [canManage]="canManage()"
    [saving]="saving()"
    [error]="drawerError()"
    [issues]="drawerIssueMessages()"
    (close)="closeDrawer()"
    (update)="update($event)"
    (archive)="setArchived($event)"
    (remove)="remove()"
    (openPdf)="openCurrentPdf()"
    (uploadBrochure)="uploadBrochure($event)"
    (removeBrochure)="removeBrochure()"
  />
}

@if (refToDelete(); as target) {
  <app-delete-modal
    [heading]="refKeys[target.kind] + '.deleteHeading' | translate"
    [message]="refKeys[target.kind] + '.confirmDelete' | translate: { name: target.ref.name }"
    (cancel)="cancelRemoveRef()"
    (confirm)="confirmRemoveRef()"
  />
}
